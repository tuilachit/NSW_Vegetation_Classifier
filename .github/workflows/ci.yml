name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - run: python -m pip install -r backend/requirements-ci.txt
      - name: Lint
        run: ruff check backend
      - name: Typecheck preprocessing modules
        run: >-
          mypy --ignore-missing-imports
          backend/nsw_veg_inference/config.py
          backend/nsw_veg_inference/preprocess.py
          backend/nsw_veg_inference/raw_preprocess.py
      - name: Tests
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests
      - name: Build
        run: python -m compileall -q backend
